name: Manhunt
version: 1.0
main: com.example.manhunt.Main
api-version: '26.2'
authors: [Jules]
description: A complete Manhunt plugin for Minecraft Paper 26.2
commands:
  manhunt:
    description: Manhunt commands
    permission: manhunt.admin
    usage: /manhunt [setlobby]
permissions:
  manhunt.admin:
    description: Allows access to manhunt admin commands
    default: op