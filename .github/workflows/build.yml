name: Build Paper Plugin

on:
  workflow_dispatch: # Erlaubt das manuelle Ausführen über den "Actions" Tab auf GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 25 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '25' # Aktualisiert für Paper 26.2
          distribution: 'temurin'
          cache: maven

      - name: Plugin kompilieren
        run: mvn clean package

      - name: Jar-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: target/*.jar
